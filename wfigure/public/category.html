<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Shop — wfigure</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="site-header"></div>

<main>
  <section class="page-hero">
    <div class="container">
      <div class="breadcrumb"><a href="/index.html">Home</a> / <span id="crumbLabel">Products</span></div>
      <h1 class="page-title" id="listingTitle">All Products</h1>
    </div>
  </section>

  <section class="section" style="padding-top:32px;">
    <div class="container">
      <div class="listing-toolbar">
        <div class="filter-pills" id="statusFilters">
          <a class="filter-pill" data-status="">All</a>
          <a class="filter-pill" data-status="in-stock">In Stock</a>
          <a class="filter-pill" data-status="pre-order">Pre-order</a>
          <a class="filter-pill" data-status="out-of-stock">Out of Stock</a>
        </div>
        <select class="sort-select" id="sortSelect">
          <option value="">Sort: Featured</option>
          <option value="newest">Newest</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
        </select>
      </div>
      <div class="grid" id="productGrid">
        <div class="empty-state" style="grid-column:1/-1;">Loading products…</div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="/js/common.js"></script>
<script>
const params = new URLSearchParams(window.location.search);

function currentFilters() {
  const f = {};
  ['category','brand','series','character','status','q','featured'].forEach(k => {
    if (params.get(k)) f[k] = params.get(k);
  });
  return f;
}

function labelForFilters(f) {
  if (f.q) return `Search results for "${f.q}"`;
  if (f.character) return f.character;
  if (f.series) return f.series;
  if (f.brand) return f.brand;
  if (f.status) return statusLabel(f.status);
  if (f.featured) return 'Featured';
  if (f.category && f.category !== 'all') {
    return f.category.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  }
  return 'All Products';
}

async function loadProducts() {
  const f = currentFilters();
  const label = labelForFilters(f);
  document.title = `${label} — wfigure`;
  document.getElementById('pageTitle').textContent = `${label} — wfigure`;
  document.getElementById('listingTitle').textContent = label;
  document.getElementById('crumbLabel').textContent = label;

  // sync status pills
  document.querySelectorAll('#statusFilters .filter-pill').forEach(pill => {
    pill.classList.toggle('active', (pill.dataset.status || '') === (f.status || ''));
    pill.href = buildURL({ ...f, status: pill.dataset.status || undefined });
  });

  const sortSelect = document.getElementById('sortSelect');
  sortSelect.value = params.get('sort') || '';
  sortSelect.onchange = () => {
    const p = new URLSearchParams(window.location.search);
    if (sortSelect.value) p.set('sort', sortSelect.value); else p.delete('sort');
    window.location.search = p.toString();
  };

  const query = new URLSearchParams(f);
  if (params.get('sort')) query.set('sort', params.get('sort'));

  try {
    const res = await fetch(`/api/products?${query.toString()}`);
    const items = await res.json();
    const grid = document.getElementById('productGrid');
    grid.innerHTML = items.length
      ? items.map(productCardHTML).join('')
      : `<div class="empty-state" style="grid-column:1/-1;">
           <svg viewBox="0 0 24 24" fill="none" stroke-width="1.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
           <div>No products found for this filter yet.</div>
           <a class="btn btn-outline" style="margin-top:18px;" href="/category.html?category=all">View other items</a>
         </div>`;
  } catch (e) {
    console.error(e);
  }
}

function buildURL(filters) {
  const p = new URLSearchParams();
  Object.entries(filters).forEach(([k, v]) => { if (v) p.set(k, v); });
  return `/category.html?${p.toString()}`;
}

document.addEventListener('DOMContentLoaded', loadProducts);
</script>
</body>
</html>
