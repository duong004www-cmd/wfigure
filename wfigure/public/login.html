<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login / Register — wfigure</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="site-header"></div>

<main>
  <div class="container">
    <div class="auth-wrap">
      <div class="auth-side">
        <span class="eyebrow" data-edit-id="login.eyebrow" data-edit-type="text" data-edit-label="Login side eyebrow">wfigure member</span>
        <h3 data-edit-id="login.heading" data-edit-type="text" data-edit-label="Login side heading">Join the collection.</h3>
        <p data-edit-id="login.intro" data-edit-type="text" data-edit-label="Login side intro">Track pre-orders, save your favorite characters, and get early access to flash sales. Existing members log in on the right — new here? Switch to Register.</p>
        <p style="margin-top:20px;">Support hotline: <strong style="color:var(--gold);">0365244436</strong></p>
      </div>
      <div class="auth-form-wrap">
        <div class="tabs">
          <button class="tab-btn active" data-tab="login">Login</button>
          <button class="tab-btn" data-tab="register">Register</button>
        </div>

        <div id="loginAlert" class="alert"></div>

        <form id="loginForm" data-mode="login">
          <div class="field">
            <label for="loginUsername">Email or Username</label>
            <input type="text" id="loginUsername" name="username" placeholder="you@email.com" required>
          </div>
          <div class="field">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" name="password" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Login</button>
          <p class="form-note">New here? <a href="#" data-tab-link="register">Create an account</a></p>
        </form>

        <form id="registerForm" data-mode="register" style="display:none;">
          <div class="field">
            <label for="regName">Full Name</label>
            <input type="text" id="regName" name="name" placeholder="Nguyen Van A" required>
          </div>
          <div class="field">
            <label for="regEmail">Email</label>
            <input type="email" id="regEmail" name="email" placeholder="you@email.com" required>
          </div>
          <div class="field">
            <label for="regPhone">Phone (optional)</label>
            <input type="tel" id="regPhone" name="phone" placeholder="09xx xxx xxx">
          </div>
          <div class="field">
            <label for="regPassword">Password</label>
            <input type="password" id="regPassword" name="password" placeholder="At least 6 characters" required minlength="6">
          </div>
          <button type="submit" class="btn btn-primary btn-block">Create Account</button>
          <p class="form-note">Already have an account? <a href="#" data-tab-link="login">Log in</a></p>
        </form>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="/js/common.js"></script>
<script>
const tabBtns = document.querySelectorAll('.tab-btn');
const loginForm = document.getElementById('loginForm');
const registerForm = document.getElementById('registerForm');
const alertBox = document.getElementById('loginAlert');

function switchTab(tab) {
  tabBtns.forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  loginForm.style.display = tab === 'login' ? 'block' : 'none';
  registerForm.style.display = tab === 'register' ? 'block' : 'none';
  alertBox.className = 'alert';
}

tabBtns.forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));
document.querySelectorAll('[data-tab-link]').forEach(a => a.addEventListener('click', (e) => {
  e.preventDefault();
  switchTab(a.dataset.tabLink);
}));

// deep-link ?tab=register
const initialTab = new URLSearchParams(window.location.search).get('tab');
if (initialTab === 'register') switchTab('register');

function setAlert(msg, type) {
  alertBox.textContent = msg;
  alertBox.className = `alert alert-${type} show`;
}

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(loginForm));
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    const result = await res.json();
    if (!res.ok) { setAlert(result.error || 'Login failed.', 'error'); return; }
    setAlert(result.message, 'success');
    setTimeout(() => {
      window.location.href = result.role === 'admin' ? '/admin/dashboard.html' : '/index.html';
    }, 700);
  } catch (err) {
    setAlert('Something went wrong. Please try again.', 'error');
  }
});

registerForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(registerForm));
  try {
    const res = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    const result = await res.json();
    if (!res.ok) { setAlert(result.error || 'Registration failed.', 'error'); return; }
    setAlert(result.message + ' Redirecting to login...', 'success');
    setTimeout(() => switchTab('login'), 1200);
    registerForm.reset();
  } catch (err) {
    setAlert('Something went wrong. Please try again.', 'error');
  }
});
</script>
</body>
</html>
