<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giỏ hàng — wfigure</title>
<meta name="description" content="Xem lại các sản phẩm trong giỏ hàng của bạn tại wfigure.">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="site-header"></div>

<main>
  <section class="page-hero">
    <div class="container">
      <div class="breadcrumb"><a href="/index.html">Trang chủ</a> / <span>Giỏ hàng</span></div>
      <h1 class="page-title" data-edit-id="cart.title" data-edit-type="text" data-edit-label="Cart page title">Giỏ hàng của bạn</h1>
    </div>
  </section>

  <section class="section" style="padding-top:0;">
    <div class="container">
      <div id="cartContent">
        <div class="empty-state">Đang tải giỏ hàng…</div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="/js/common.js"></script>
<script>
function cartRowHTML(item) {
  const media = item.image
    ? `<img src="${item.image}" alt="${item.name}"/>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.2"><path d="M12 2 3 7v10l9 5 9-5V7l-9-5Z"/><path d="M3 7l9 5 9-5"/><path d="M12 12v10"/></svg>`;
  return `
  <div class="cart-row" data-id="${item.id}">
    <a href="/product.html?id=${item.id}" class="cart-row-media">${media}</a>
    <div class="cart-row-info">
      <a href="/product.html?id=${item.id}" class="name">${item.name}</a>
      <span class="brand">${item.brand || ''}</span>
    </div>
    <span class="cart-row-price">${formatVND(item.price)}</span>
    <div class="qty-stepper">
      <button type="button" class="qty-minus" aria-label="Giảm số lượng">${ICONS.minus}</button>
      <input type="text" inputmode="numeric" class="qty-input" value="${item.qty}" readonly>
      <button type="button" class="qty-plus" aria-label="Tăng số lượng">${ICONS.plus}</button>
    </div>
    <button type="button" class="cart-row-remove" aria-label="Xoá sản phẩm">${ICONS.trash}</button>
  </div>`;
}

function renderCart() {
  const cart = getCart();
  const container = document.getElementById('cartContent');

  if (!cart.length) {
    container.innerHTML = `
      <div class="cart-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <div>Không có sản phẩm nào trong giỏ hàng.</div>
        <p style="margin:14px 0 0;">Quay lại <a href="/category.html?category=all">cửa hàng</a> để tiếp tục mua sắm.</p>
      </div>`;
    updateCartBadge();
    return;
  }

  container.innerHTML = `
    <div class="cart-layout">
      <div class="cart-list" id="cartList">
        ${cart.map(cartRowHTML).join('')}
      </div>
      <aside class="cart-summary">
        <h3>Tổng đơn hàng</h3>
        <div class="cart-summary-row">
          <span>Tạm tính (${cartCount()} sản phẩm)</span>
          <span>${formatVND(cartSubtotal())}</span>
        </div>
        <div class="cart-summary-row">
          <span>Vận chuyển</span>
          <span>Tính khi thanh toán</span>
        </div>
        <div class="cart-summary-row total">
          <span>Tổng cộng</span>
          <span class="price-now">${formatVND(cartSubtotal())}</span>
        </div>
        <button class="btn btn-primary btn-block" id="checkoutBtn" style="margin-top:18px;">Thanh toán</button>
        <a href="/category.html?category=all" class="btn btn-outline btn-block" style="margin-top:10px;">Tiếp tục mua sắm</a>
        <div class="promo-note">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M12 2 3 7v10l9 5 9-5V7l-9-5Z"/><path d="M3 7l9 5 9-5"/><path d="M12 12v10"/></svg>
          <span>Nhập mã <code>WF10</code> để giảm ngay 10% cho đơn hàng từ 500.000₫. Áp dụng ở bước thanh toán.</span>
        </div>
      </aside>
    </div>`;

  wireCartEvents();
  updateCartBadge();
}

function wireCartEvents() {
  document.querySelectorAll('.cart-row').forEach(row => {
    const id = row.dataset.id;
    row.querySelector('.qty-minus').addEventListener('click', () => {
      const cart = getCart();
      const item = cart.find(i => i.id === id);
      if (!item) return;
      if (item.qty <= 1) { removeFromCart(id); } else { setCartQty(id, item.qty - 1); }
      renderCart();
    });
    row.querySelector('.qty-plus').addEventListener('click', () => {
      const cart = getCart();
      const item = cart.find(i => i.id === id);
      if (!item) return;
      setCartQty(id, item.qty + 1);
      renderCart();
    });
    row.querySelector('.cart-row-remove').addEventListener('click', () => {
      removeFromCart(id);
      showToast('Đã xoá sản phẩm khỏi giỏ hàng', 'success');
      renderCart();
    });
  });

  const checkoutBtn = document.getElementById('checkoutBtn');
  if (checkoutBtn) {
    checkoutBtn.addEventListener('click', () => {
      window.location.href = '/checkout.html';
    });
  }
}

document.addEventListener('DOMContentLoaded', renderCart);
</script>
</body>
</html>
