<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Product — wfigure</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="site-header"></div>

<main>
  <section class="page-hero" style="padding-bottom:0;border-bottom:none;">
    <div class="container">
      <div class="breadcrumb"><a href="/index.html">Home</a> / <a href="/category.html?category=all">Products</a> / <span id="crumbName">...</span></div>
    </div>
  </section>

  <div class="container">
    <div class="product-detail" id="productDetail">
      <div class="empty-state" style="grid-column:1/-1;">Loading product…</div>
    </div>
  </div>

  <div id="productDescriptionImages"></div>

  <section class="section" style="background:var(--ink-2);border-top:1px solid var(--line);">
    <div class="container">
      <div class="section-head">
        <div><h2 data-edit-id="product.relatedTitle" data-edit-type="text" data-edit-label="Related products heading">You may also like</h2></div>
        <a class="view-all" href="/category.html?category=all">View other items →</a>
      </div>
      <div class="grid" id="relatedGrid"></div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="/js/common.js"></script>
<script>
const id = new URLSearchParams(window.location.search).get('id');

function renderGallery(images, name) {
  const mainImg = images[0]
    ? `<img id="mainImg" src="${images[0]}" alt="${name}"/>`
    : `<svg class="ph-icon" viewBox="0 0 24 24" fill="none" stroke-width="1" style="width:40%;stroke:var(--text-faint);"><path d="M12 2 3 7v10l9 5 9-5V7l-9-5Z"/><path d="M3 7l9 5 9-5"/><path d="M12 12v10"/></svg>`;
  const thumbs = images.map((img, i) => `
    <div class="pd-thumb ${i === 0 ? 'active' : ''}" data-src="${img}"><img src="${img}" alt="thumb ${i}"/></div>
  `).join('');
  return `
    <div>
      <div class="pd-gallery-main">${mainImg}</div>
      ${images.length > 1 ? `<div class="pd-thumbs">${thumbs}</div>` : ''}
    </div>`;
}

function renderDescriptionImages(descriptionImages, name) {
  if (!descriptionImages || !descriptionImages.length) return '';
  const imgs = descriptionImages.map(img => `<img src="${img}" alt="${name} description"/>`).join('');
  return `
    <section class="section pd-description-section">
      <div class="container">
        <h2 class="pd-description-heading">Product Details</h2>
        <div class="pd-description-images">${imgs}</div>
      </div>
    </section>`;
}

async function loadProduct() {
  if (!id) {
    document.getElementById('productDetail').innerHTML = `<div class="empty-state" style="grid-column:1/-1;">No product specified.</div>`;
    return;
  }
  try {
    const res = await fetch(`/api/products/${id}`);
    if (!res.ok) throw new Error('not found');
    const p = await res.json();
    document.title = `${p.name} — wfigure`;
    document.getElementById('pageTitle').textContent = `${p.name} — wfigure`;
    document.getElementById('crumbName').textContent = p.name;

    const discount = (p.oldPrice && p.oldPrice > p.price) ? Math.round(100 - (p.price / p.oldPrice) * 100) : 0;

    document.getElementById('productDetail').innerHTML = `
      ${renderGallery(p.images || [], p.name)}
      <div class="pd-info">
        <span class="card-brand">${p.brand || ''}</span>
        <h1>${p.name}</h1>
        <span class="status-tag status-${p.status}" style="position:static;display:inline-block;">${statusLabel(p.status)}</span>
        <div class="pd-price-row">
          <span class="price-now">${formatVND(p.price)}</span>
          ${p.oldPrice > p.price ? `<span class="price-old">${formatVND(p.oldPrice)}</span>` : ''}
          ${discount > 0 ? `<span class="discount-tag" style="position:static;">-${discount}%</span>` : ''}
        </div>
        <div class="pd-meta">
          <div><span>Series</span><strong>${p.series || '—'}</strong></div>
          <div><span>Character</span><strong>${p.character || '—'}</strong></div>
          <div><span>Brand</span><strong>${p.brand || '—'}</strong></div>
          <div><span>Category</span><strong>${p.category.replace(/-/g,' ')}</strong></div>
        </div>
        <p class="pd-desc">${p.description || 'No description provided yet.'}</p>
        <div class="pd-actions">
          <div class="qty-stepper">
            <button type="button" id="qtyMinus" aria-label="Decrease quantity">${ICONS.minus}</button>
            <input type="text" inputmode="numeric" id="qtyInput" class="qty-input" value="1" readonly>
            <button type="button" id="qtyPlus" aria-label="Increase quantity">${ICONS.plus}</button>
          </div>
          <button class="btn btn-primary" id="addCartBtn">Add to Cart</button>
          <a href="tel:${SUPPORT_PHONE}" class="btn btn-outline">${ICONS.phone} Call to Order</a>
        </div>
      </div>
    `;

    document.getElementById('productDescriptionImages').innerHTML = renderDescriptionImages(p.descriptionImages || (p.descriptionImage ? [p.descriptionImage] : []), p.name);

    document.querySelectorAll('.pd-thumb').forEach(t => {
      t.addEventListener('click', () => {
        document.getElementById('mainImg').src = t.dataset.src;
        document.querySelectorAll('.pd-thumb').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
      });
    });

    let qty = 1;
    const qtyInput = document.getElementById('qtyInput');
    document.getElementById('qtyMinus').addEventListener('click', () => {
      qty = Math.max(1, qty - 1);
      qtyInput.value = qty;
    });
    document.getElementById('qtyPlus').addEventListener('click', () => {
      qty += 1;
      qtyInput.value = qty;
    });

    document.getElementById('addCartBtn').addEventListener('click', () => {
      addToCart(p, qty);
    });

    loadRelated(p);
  } catch (e) {
    document.getElementById('productDetail').innerHTML = `<div class="empty-state" style="grid-column:1/-1;">Product not found.</div>`;
  }
}

async function loadRelated(p) {
  try {
    const res = await fetch(`/api/products?category=${p.category}&limit=4`);
    const items = (await res.json()).filter(i => i.id !== p.id);
    document.getElementById('relatedGrid').innerHTML = items.map(productCardHTML).join('') || `<div class="empty-state" style="grid-column:1/-1;">No related products yet.</div>`;
  } catch (e) { console.error(e); }
}

document.addEventListener('DOMContentLoaded', loadProduct);
</script>
</body>
</html>
