<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Blog — wfigure</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="site-header"></div>

<main>
  <section class="page-hero">
    <div class="container">
      <div class="breadcrumb"><a href="/index.html">Home</a> / <a href="/blog.html">Blog</a> / <span id="breadcrumbTitle">Post</span></div>
      <h1 class="page-title" id="postTitle">Loading…</h1>
    </div>
  </section>

  <section class="section">
    <div class="container" style="max-width:820px;">
      <div id="postMeta" style="color:var(--text-faint);font-size:0.88rem;margin-bottom:20px;"></div>
      <div id="postCover" style="border-radius:var(--radius-md);overflow:hidden;margin-bottom:28px;background:var(--surface-2);"></div>
      <div id="postContent" style="color:var(--text-dim);line-height:1.85;font-size:0.98rem;"></div>
    </div>
  </section>

  <section class="section" style="background:var(--ink-2);border-top:1px solid var(--line);">
    <div class="container">
      <div class="section-head">
        <div><h2>More from the blog</h2></div>
        <a class="view-all" href="/blog.html">View all →</a>
      </div>
      <div class="blog-grid" id="relatedGrid"></div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="/js/common.js"></script>
<script>
function getSlug() {
  return new URLSearchParams(window.location.search).get('slug');
}

function escapeHtmlToParagraphs(text) {
  const div = document.createElement('div');
  div.textContent = text || '';
  return div.innerHTML.split(/\n{2,}/).map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
}

async function loadPost() {
  const slug = getSlug();
  if (!slug) { window.location.href = '/blog.html'; return; }
  try {
    const res = await fetch(`/api/blog/${encodeURIComponent(slug)}`);
    if (!res.ok) throw new Error('Not found');
    const post = await res.json();

    document.getElementById('pageTitle').textContent = `${post.title} — wfigure`;
    document.getElementById('postTitle').textContent = post.title;
    document.getElementById('breadcrumbTitle').textContent = post.title;
    const date = post.publishedAt ? new Date(post.publishedAt).toLocaleDateString('en-GB') : '';
    document.getElementById('postMeta').textContent = `${post.category || 'News'} · ${date}${post.author ? ' · by ' + post.author : ''}`;

    const coverEl = document.getElementById('postCover');
    coverEl.innerHTML = post.coverImage ? `<img src="${post.coverImage}" alt="${post.title}" style="width:100%;display:block;">` : '';
    if (!post.coverImage) coverEl.style.display = 'none';

    document.getElementById('postContent').innerHTML = escapeHtmlToParagraphs(post.content);

    const relRes = await fetch(`/api/blog?category=${encodeURIComponent(post.category)}&limit=4`);
    const related = (await relRes.json()).filter(p => p.slug !== post.slug).slice(0, 3);
    document.getElementById('relatedGrid').innerHTML = related.map(blogCardHTML).join('') || `<div class="empty-state" style="grid-column:1/-1;">No related posts yet.</div>`;
  } catch (e) {
    document.getElementById('postTitle').textContent = 'Post not found';
    document.getElementById('postContent').innerHTML = `<p>This post doesn't exist or was removed. <a href="/blog.html" style="color:var(--coral);">Back to blog →</a></p>`;
  }
}

document.addEventListener('DOMContentLoaded', loadPost);
</script>
</body>
</html>
